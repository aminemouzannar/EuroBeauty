<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Favorites | EuroBeauty Market</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>:root{--ink:#171717;--muted:#5f5a58;--rose:#c86469;--blush:#f5e6e2;--paper:#fffdfb;--line:#e8dfdc}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:var(--paper);font-family:'DM Sans',sans-serif}a{color:inherit;text-decoration:none}button{border:0;cursor:pointer;font:inherit}.topbar{display:flex;justify-content:space-between;padding:8px 5%;background:#f2d7d4;font-size:11px}.nav{display:flex;align-items:center;gap:26px;padding:17px 5%;background:#fff}.logo{font:600 29px/24px 'Playfair Display',serif;letter-spacing:-1.5px}.logo small{display:block;font:700 9px/15px 'DM Sans',sans-serif;letter-spacing:4px;text-align:center}.continue{margin-left:auto;border-bottom:1px solid;padding-bottom:4px;font-size:12px;font-weight:600}.actions{display:flex;gap:17px;font-size:21px}.favorite,.cart{position:relative}.icon-count{position:absolute;top:-8px;right:-9px;display:grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--ink);color:#fff;font-size:9px}main{width:min(1080px,90%);margin:auto;padding:50px 0 68px}h1,h2{font-family:'Playfair Display',serif;font-weight:500}h1{margin:0 0 8px;font-size:42px}.intro{margin:0 0 30px;color:var(--muted);font-size:14px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:17px}.card{padding:12px;border:1px solid var(--line);border-radius:7px;background:#fff}.card img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:4px;background:#fafafa}.card h2{min-height:39px;margin:11px 0 4px;font:600 12px/1.4 'DM Sans',sans-serif}.sku{color:var(--muted);font-size:10px}.buttons{display:grid;grid-template-columns:1fr 32px;gap:7px;margin-top:12px}.add{padding:8px;border-radius:4px;background:var(--rose);color:#fff;font-size:11px;font-weight:700}.remove{border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);font-size:18px}.empty{padding:45px 20px;border:1px dashed var(--line);border-radius:8px;text-align:center}.empty h2{margin:0 0 8px;font-size:27px}.empty p{color:var(--muted);font-size:13px}.shop{display:inline-block;padding:11px 18px;border-radius:22px;background:var(--rose);color:#fff;font-size:12px;font-weight:700}footer{display:flex;justify-content:space-between;padding:22px 5%;background:#211d1c;color:#fff;font-size:11px}@media(max-width:720px){.topbar{justify-content:center}.topbar span:not(:first-child){display:none}.grid{grid-template-columns:repeat(2,1fr)}main{width:92%;padding-top:35px}h1{font-size:35px}footer{display:block;line-height:2}}</style>
</head>
<body>
  <div class="topbar"><span>▣ &nbsp; Free shipping to the USA</span><span>Authentic German Products &nbsp; | &nbsp; Delivered to the USA</span><span>♡ &nbsp; Beauty from Germany, for You</span></div>
  <header class="nav"><a class="logo" href="index.html">EuroBeauty<small>MARKET</small></a><a class="continue" href="index.html">← Continue shopping</a><div class="actions"><a class="favorite" href="favorites.html" aria-label="Favorites">♡<b class="icon-count favorite-count">0</b></a><a class="cart" href="basket.html" aria-label="Basket">🛒<b class="icon-count basket-count">0</b></a></div></header>
  <main><h1>Your Favorites</h1><p class="intro" id="intro">Save the German beauty products you love.</p><section class="grid" id="grid" aria-live="polite"></section></main><footer><span>© 2026 EuroBeauty Market</span><span>Authentic German beauty, delivered with care.</span></footer>
  <script>
    const favoriteKey='euroBeautyFavorites',basketKey='euroBeautyBasket',grid=document.querySelector('#grid');const get=(key)=>{try{return JSON.parse(localStorage.getItem(key))||[]}catch{return[]}},save=(key,value)=>localStorage.setItem(key,JSON.stringify(value));const esc=(value)=>String(value).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const updateHeader=()=>{document.querySelector('.favorite-count').textContent=get(favoriteKey).length;document.querySelector('.basket-count').textContent=get(basketKey).reduce((n,item)=>n+item.quantity,0)};
    const render=()=>{const favorites=get(favoriteKey);updateHeader();if(!favorites.length){document.querySelector('#intro').textContent='Your favorite products will be saved here.';grid.innerHTML='<div class="empty"><h2>No favorites yet</h2><p>Tap the heart on any product to save it here.</p><a class="shop" href="index.html">Explore products</a></div>';return}document.querySelector('#intro').textContent=`${favorites.length} ${favorites.length===1?'product':'products'} saved`;grid.innerHTML=favorites.map((item,index)=>`<article class="card"><img src="${esc(item.image)}" alt="${esc(item.alt||item.name)}"><h2>${esc(item.name)}</h2><span class="sku">SKU: ${esc(item.sku)}</span><div class="buttons"><button class="add" data-action="basket" data-index="${index}">Add to basket</button><button class="remove" data-action="remove" data-index="${index}" aria-label="Remove from favorites">♥</button></div></article>`).join('')};
    grid.addEventListener('click',event=>{const button=event.target.closest('button[data-action]');if(!button)return;const favorites=get(favoriteKey),index=Number(button.dataset.index);if(button.dataset.action==='remove'){favorites.splice(index,1);save(favoriteKey,favorites)}else{const item=favorites[index],basket=get(basketKey),match=basket.find(entry=>entry.sku===item.sku);if(match)match.quantity++;else basket.push({...item,quantity:1});save(basketKey,basket)}render()});render();
  </script>
</body>
</html>
